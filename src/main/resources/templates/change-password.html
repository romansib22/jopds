<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля - JOPDS</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Смена пароля</h1>
            <div class="user-info">
                <a th:href="@{/settings}" class="btn btn-link">Настройки</a>
                <a th:href="@{/}" class="btn btn-link">Главная</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-link">Выйти</button>
                </form>
            </div>
        </header>
        
        <main class="main-content">
            <div th:if="${error}" class="error-message">
                <p th:text="${error}">Ошибка</p>
            </div>
            
            <div class="search-section">
                <h2>Изменить пароль</h2>
                <p>Пароль должен содержать не менее 8 символов</p>
                
                <form th:action="@{/settings/change-password}" method="post" class="search-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    
                    <div class="form-group">
                        <label for="oldPassword">Старый пароль:</label>
                        <input type="password" 
                               id="oldPassword" 
                               name="oldPassword" 
                               required
                               autofocus
                               style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 16px;"/>
                    </div>
                    
                    <div class="form-group">
                        <label for="newPassword">Новый пароль:</label>
                        <input type="password" 
                               id="newPassword" 
                               name="newPassword" 
                               required
                               minlength="8"
                               style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 16px;"/>
                        <small style="color: #666; font-size: 14px;">Минимум 8 символов</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Подтверждение пароля:</label>
                        <input type="password" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               required
                               minlength="8"
                               style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 16px;"/>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">Изменить пароль</button>
                        <a th:href="@{/settings}" class="btn btn-link">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <script>
        // Проверка совпадения паролей перед отправкой формы
        document.querySelector('form').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword.length < 8) {
                e.preventDefault();
                alert('Пароль должен содержать не менее 8 символов');
                return false;
            }
            
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                alert('Новый пароль и подтверждение не совпадают');
                return false;
            }
        });
    </script>
</body>
</html>
